<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兔克出海 · 数据管理 · 分享视图</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="tuke-viewer-version" content="2026-10-12">
<style>
/* =========================================================
   兔克出海 · 只读数据查看器模板 v3（自包含 / 离线 / 零外部资源）
   设计语言：Light SaaS（规范 v2.1 + dashboard_v6 原型）
   —— 已剥离一切外部样式 / 字体 CDN 依赖，仅使用本地字体栈回退，离线可用。
   ========================================================= */
:root {
  /* 品牌色 */
  --primary: #1664FF;
  --primary-light: #EEF3FF;
  --primary-dark: #0F4FCC;
  --primary-grad-1: #4D8EFF;
  --primary-grad-2: #06B6D4;

  /* 语义色 */
  --success: #00C853; --success-bg: #E8F9E8;
  --danger: #EB103C;  --danger-bg: #FDECEF;
  --warn: #FFC300;    --warn-bg: #FFF8E1;
  --cyan: #06B6D4;

  /* 中性色（v2.1） */
  --bg-page: #F8FAFB;
  --bg-surface: #FFFFFF;
  --bg-sidebar: #FFFFFF;
  --bg-hover: #F0F5FF;
  --ink: #141414;
  --ink-2: #282828;
  --ink-3: #585858;
  --placeholder: #94A3B8;
  --border: #EAECF0;
  --border-light: #F1F3F7;

  /* 图表平台色（对齐 v2.1 donut / 主系统 charts.js） */
  --plat-tiktok: #1664FF; --plat-xhs: #EB103C; --plat-wechat: #00C853; --plat-youtube: #FFC300;

  /* 阴影（v2.1 取向） */
  --shadow-card: 0 2px 12px rgba(0,0,0,0.04);
  --shadow-hover: 0 8px 28px rgba(0,0,0,0.08);
  --shadow-btn: 0 4px 14px rgba(22,100,255,0.30);

  /* 字体（v2.1，本地回退栈，无 CDN） */
  --font-cn: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-num: "Plus Jakarta Sans", "Segoe UI", "SF Pro Display", -apple-system, system-ui, sans-serif;

  /* 兼容期别名：旧 --blue-* 重映射，避免一次性破坏 */
  --blue-500: #1664FF;
  --blue-400: #4D8EFF;
  --blue-50:  #F0F5FF;
  --blue-600: #0F4FCC;

  /* 圆角 */
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-cn);
  color: var(--ink);
  background: var(--bg-page);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ── 页面容器 ── */
.viewer { max-width: 1320px; margin: 0 auto; padding: 40px 40px 56px; }

/* ── 顶 banner ── */
.top-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 24px 28px; margin-bottom: 24px;
  background: var(--bg-surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
}
.banner-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top-banner h1 { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.badge {
  background: var(--primary-light); border: 1px solid #D0DEFF; color: var(--primary);
  padding: 5px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge.warn {
  background: #FFF4E5; border: 1px solid #FFD8A8; color: #B26A00;
}
.date-range { color: var(--ink-3); font-size: 13px; font-weight: 500; }

/* ── 筛选栏 ── */
.filter-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  background: var(--bg-surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); padding: 16px 22px; box-shadow: var(--shadow-card); margin-bottom: 28px;
}
.filter-left { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.v-field { display: flex; flex-direction: column; gap: 6px; }
.v-field label { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .2px; }
.v-field select {
  appearance: none; -webkit-appearance: none;
  height: 42px; min-width: 170px; padding: 0 36px 0 16px;
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  background-color: var(--bg-surface); color: var(--ink);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23585858' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right 16px center;
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .12s, box-shadow .12s;
}
.v-field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,100,255,.12); }
.btn-export {
  height: 42px; padding: 0 22px; border-radius: var(--radius-md); border: none;
  background: linear-gradient(135deg, var(--primary-grad-1), var(--primary));
  color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-btn); transition: transform .12s, box-shadow .12s; white-space: nowrap;
}
.btn-export:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(22,100,255,.4); }
.btn-export:active { transform: translateY(0); }

/* ── 区块标题 ── */
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.section-title { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.section-sub { font-size: 13px; font-weight: 600; color: var(--primary); background: var(--primary-light); padding: 3px 12px; border-radius: var(--radius-pill); }

/* ── KPI 卡片区 ── */
/* Bug-4①：5 个指标 + 1 张「关键变化」共 6 卡，3 列铺成 3+2 两行 */
/* Bug-4②：grid-auto-rows:1fr 让两行卡片等高；卡片 flex 纵向撑开 */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; grid-auto-rows: 1fr; margin-bottom: 28px; }
.kpi-card {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px 24px;
  box-shadow: var(--shadow-card); transition: transform .25s, box-shadow .25s;
}
/* 「关键变化」卡片与 KPI 并排同区：复用 insight-body 内部样式 */
.kpi-change-card .kpi-label { font-weight: 700; }
.kpi-change-card .insight-body { flex: 1; display: flex; flex-direction: column; justify-content: center; margin-top: 6px; }
.kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.kpi-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--kpi-accent, #1664FF); }
.kpi-label { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-bottom: 10px; }
/* Bug-4①：KPI 卡片线性图标（SVG），按指标着色，与文案同排 */
.kpi-ico { width: 18px; height: 18px; display: inline-flex; align-items: center; vertical-align: -3px; margin-right: 4px; }
.kpi-ico svg { width: 100%; height: 100%; display: block; }
.kpi-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.kpi-value {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 42px; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -.5px;
}
.kpi-change { font-size: 12.5px; font-weight: 700; margin-top: 8px; }
.kpi-change .vs { font-weight: 500; color: var(--ink-3); margin-left: 4px; font-size: 11px; }
.kpi-change.up { color: var(--success); }
.kpi-change.down { color: var(--danger); }
.kpi-change.flat { color: var(--ink-3); }
.kpi-range { font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--bg-hover); padding: 2px 8px; border-radius: 6px; display: inline-block; width: fit-content; margin-top: 6px; }
.kpi-sparkline { width: 80px; height: 36px; flex-shrink: 0; }

/* ── 图表区 ── */
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 28px; align-items: stretch; }
.chart-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px 24px; box-shadow: var(--shadow-card); transition: transform .25s, box-shadow .25s;
  display: flex; flex-direction: column;
}
.chart-card:hover { box-shadow: var(--shadow-hover); }
.chart-card-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.chart-card-hd h3 { font-size: 16px; font-weight: 700; color: var(--ink); }
.chart-card-hd .tag { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--primary-light); color: var(--primary); white-space: nowrap; }
.chart-wrap { position: relative; width: 100%; min-height: 360px; flex: 1; }
.donut-wrap { min-height: 340px; }

/* ── 洞察卡片区 ── */
.insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; align-items: start; }
.insight-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px 24px; box-shadow: var(--shadow-card); transition: transform .25s, box-shadow .25s;
}
.insight-card:hover { box-shadow: var(--shadow-hover); }
.insight-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.insight-hd h3 { font-size: 16px; font-weight: 700; color: var(--ink); }
.insight-hd .tag { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: var(--radius-pill); background: var(--primary-light); color: var(--primary); }
/* 平台贡献 Top3 指标切换（播放阅读/互动/发布） */
.insight-toggle { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.insight-toggle .it-btn { appearance: none; -webkit-appearance: none; border: 1px solid var(--border); background: var(--bg-surface); color: var(--ink-3); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); cursor: pointer; transition: all .15s; }
.insight-toggle .it-btn.active { background: var(--primary-light); color: var(--primary); border-color: transparent; }
.rank-plat { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; color: var(--ink-3); margin-right: 6px; }
.insight-body { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
.insight-body .rank-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.insight-body .rank-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
.insight-body .rank-item:last-child { border-bottom: none; }
.insight-body .rank-badge {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; background: var(--primary);
}
.insight-body .rank-badge.g1 { background: linear-gradient(135deg, #FFC300, #FF8800); color: #141414; }
.insight-body .rank-badge.g2 { background: linear-gradient(135deg, #94A3B8, #64748B); color: #fff; }
.insight-body .rank-badge.g3 { background: linear-gradient(135deg, #D97706, #B45309); color: #fff; }
.insight-body .rank-main { flex: 1; min-width: 0; }
.insight-body .rank-title { font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insight-body .rank-title a { color: var(--primary); text-decoration: none; }
.insight-body .rank-title a:hover { text-decoration: underline; }
.insight-body .rank-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.insight-body .rank-bar { flex: 1; height: 5px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.insight-body .rank-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-grad-2)); border-radius: 3px; }
.insight-body .rank-value { flex-shrink: 0; font-family: var(--font-num); font-weight: 800; font-size: 14px; color: var(--ink); text-align: right; min-width: 56px; }
.insight-body .change-hero { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: linear-gradient(90deg, #F8FAFB, #fff); border: 1px solid var(--border-light); border-radius: 12px; margin-bottom: 14px; }
.insight-body .change-hero .arrow { font-size: 26px; font-weight: 800; line-height: 1; }
.insight-body .change-hero.up .arrow { color: var(--success); }
.insight-body .change-hero.down .arrow { color: var(--danger); }
.insight-body .change-hero .metric { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.insight-body .change-hero .value { font-size: 22px; font-weight: 800; color: var(--ink); font-family: var(--font-num); }
.insight-body .change-hero .rate { font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: var(--radius-pill); }
.insight-body .change-hero.up .rate { background: var(--success-bg); color: var(--success); }
.insight-body .change-hero.down .rate { background: var(--danger-bg); color: var(--danger); }
.insight-body .change-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.insight-body .change-tag { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: var(--radius-pill); background: var(--bg-hover); color: var(--ink-2); }
.insight-body .change-tag.up { color: var(--success); background: var(--success-bg); }
.insight-body .change-tag.down { color: var(--danger); background: var(--danger-bg); }
.insight-body .muted { color: var(--ink-3); font-size: 12.5px; }

/* ── 明细表 ── */
.table-scroll-wrapper { overflow-x: auto; border-radius: var(--radius-lg); }
.data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.data-table th, .data-table td { padding: 14px 18px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--border-light); white-space: nowrap; }
.data-table thead th { background: #F0F4FF; color: var(--ink-2); font-weight: 700; font-size: 12.5px; letter-spacing: .3px; border-bottom: 1px solid var(--border); }
.data-table tbody tr:nth-child(even) { background: #FAFBFD; }
.data-table tbody tr { position: relative; transition: background .15s; }
.data-table tbody tr:hover { background: #F1F5FF; }
.data-table tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.data-table tbody tr.total-row { background: linear-gradient(90deg, #EEF3FF, #F5F8FF); font-weight: 700; border-top: 2px solid var(--primary); }
.data-table tbody tr.total-row td { color: var(--primary); }
.data-table td.num, .data-table th.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.data-table td:first-child, .data-table th:first-child { text-align: left; font-weight: 700; }
/* Bug-4④：平台原色 tag（彩色圆点）+ 环比变化列着色 */
.plat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; flex-shrink: 0; }
.data-table td.rate-cell.up { color: var(--success); font-weight: 700; }
.data-table td.rate-cell.down { color: var(--danger); font-weight: 700; }
.data-table td.rate-cell.flat { color: var(--ink-3); font-weight: 600; }

/* ── 周期总结 ── */
.summary-body { font-size: 14px; color: var(--ink-2); line-height: 1.8; }
.sum-block { margin-bottom: 22px; }
.sum-block:last-child { margin-bottom: 0; }
.sum-label { font-size: 13px; font-weight: 800; color: var(--ink-3); letter-spacing: .3px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.sum-label::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--primary); }
.sum-good .sum-label::before { background: var(--success); }
.sum-other .sum-label::before { background: var(--warn); }
.sum-extra .sum-label::before { background: var(--cyan); }
.summary-body p { margin: 0 0 10px; }
.summary-body p:last-child { margin-bottom: 0; }
.summary-body ul { margin: 0; padding-left: 20px; }
.summary-body li { padding: 3px 0; }

/* ── 页脚 ── */
.page-footer { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; text-align: center; color: var(--placeholder); font-size: 12.5px; padding-top: 8px; margin-top: 8px; }
/* Bug-4④：页脚 logo 透明底、去圆角去阴影（原 PNG 为不透明白底，故改用透明 icon 资源） */
.footer-logo { height: 20px; width: auto; display: block; background: transparent; border-radius: 0; box-shadow: none; padding: 0; }

/* ═══════════════════════════════════════════════════════════
   图表交互样式（对齐主系统 charts.js / 规范 v2.1）
   ═══════════════════════════════════════════════════════════ */
@keyframes lineDrawIn { from { stroke-dashoffset: var(--dash-len, 2000); } to { stroke-dashoffset: 0; } }
@keyframes areaFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes donutSweep { from { stroke-dashoffset: var(--seg-len, 1000); } to { stroke-dashoffset: 0; } }
@keyframes kpiSparkIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.chart-tooltip {
  position: absolute; background: #fff; color: var(--ink);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
  padding: 12px 16px; font-size: 12px; line-height: 1.5;
  pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 50; white-space: nowrap;
}
.chart-tooltip.mobile { left: 50% !important; right: auto !important; transform: translateX(-50%); top: 8px !important; bottom: auto !important; }
.lc-tab, .dc-tab {
  appearance: none; -webkit-appearance: none;
  border: 1px solid var(--border); background: var(--bg-surface);
  color: var(--ink-3); font-size: 12px; font-weight: 600; padding: 5px 12px;
  border-radius: var(--radius-pill); cursor: pointer; transition: all .15s ease;
}
.lc-tab.active, .dc-tab.active { background: var(--primary-light); color: var(--primary); border-color: transparent; }
.line-legend-item { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: opacity .3s ease; font-size: 12.5px; color: var(--ink-2); }
.line-legend-item .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.line-legend-item.off { opacity: .4; }
.chart-empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--placeholder); font-size: 13px; gap: 8px; }
.chart-line.draw { stroke-dasharray: var(--dash-len, 2000); stroke-dashoffset: var(--dash-len, 2000); animation: lineDrawIn .8s ease-out forwards; }
.chart-area.fill { opacity: 0; animation: areaFadeIn .4s ease .6s forwards; }
.chart-donut-seg { stroke-dasharray: var(--seg-len, 1000); stroke-dashoffset: var(--seg-len, 1000); animation: donutSweep .5s ease-out backwards; }

.lc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.lc-tabs { display: inline-flex; gap: 6px; }
.line-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lc-plot { width: 100%; }
.lc-cross, .lc-hl { pointer-events: none; }
.dc-head { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.dc-tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.dc-plot { width: 100%; }
/* 环形图底部图例（2x2 网格，对齐用户设计稿图4） */
.donut-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 14px; }
.donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.donut-legend-item .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.donut-legend-item .lbl { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.donut-legend-item .pct { margin-left: auto; font-family: var(--font-num); font-weight: 700; color: var(--ink-3); }

/* 环形图中心双层（对齐设计稿图5：总播放量 / 大字总计 / 占比 最大平台） */
.donut-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 86%; text-align: center; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.donut-center-sub { font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: .2px; }
.donut-center-main {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 42px; font-weight: 700; color: #1664FF; line-height: 1.05; letter-spacing: -.5px;
}
.donut-center-pct { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }

/* ═══════════════════════════════════════════════════════════
   移动端顶栏 / 抽屉（桌面隐藏）
   ═══════════════════════════════════════════════════════════ */
.mobile-topnav, .mobile-drawer, .mobile-overlay { display: none; }
.mobile-topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 200;
  display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
  background: var(--bg-surface); border-bottom: 1px solid var(--border);
}
.mobile-topnav .mobile-logo { display: flex; align-items: center; gap: 8px; }
.mobile-topnav .mobile-logo img { height: 28px; width: auto; display: block; }
.mobile-topnav .mobile-logo span { font-size: 16px; font-weight: 800; color: var(--ink); }
.hamburger-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.hamburger-btn span { display: block; width: 22px; height: 2px; background: var(--ink-3); border-radius: 2px; transition: all .3s; }
.hamburger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger-btn.open span:nth-child(2) { opacity: 0; }
.hamburger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
.mobile-overlay { display: none; position: fixed; top: 56px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 180; opacity: 0; transition: opacity .3s; }
.mobile-overlay.open { display: block; opacity: 1; }
.mobile-drawer {
  display: none; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg-surface);
  border-bottom: 1px solid var(--border); z-index: 190; padding: 16px 0;
  transform: translateY(-100%); transition: transform .3s ease; box-shadow: 0 4px 12px rgba(0,0,0,.08);
}
.mobile-drawer.open { transform: translateY(0); display: block; }
.mobile-drawer .drawer-brand { font-size: 13px; font-weight: 800; color: var(--ink); padding: 4px 24px 14px; border-bottom: 1px solid var(--border-light); }
.mobile-drawer a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--ink-3); text-decoration: none; font-size: 14px; font-weight: 500; transition: all .2s; }
.mobile-drawer a.active, .mobile-drawer a:hover { color: var(--primary); background: var(--bg-hover); }
.mobile-drawer .drawer-cap { padding: 12px 24px 4px; font-size: 11px; font-weight: 700; color: var(--primary); letter-spacing: .4px; }

/* ═══════════════════════════════════════════════════════════
   响应式断点（规范 v2.1：桌面 ≥1024 / 平板 768~1023 / 移动 <768）
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 1023px) {
  .viewer { padding: 24px 24px 40px; }
  .mobile-topnav { display: flex; }
  .top-banner { padding: 18px 20px; }
  .top-banner h1 { font-size: 20px; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .kpi-value { font-size: 36px; }
  .charts-grid { grid-template-columns: 1fr; }
  .insights-grid { grid-template-columns: 1fr; }
  .chart-wrap { min-height: 320px; }
}
@media (max-width: 767px) {
  .viewer { padding: 16px 16px 32px; }
  .top-banner { flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; }
  .top-banner h1 { font-size: 18px; }
  .date-range { font-size: 12px; }
  .filter-bar { flex-direction: column; align-items: stretch; gap: 12px; }
  .filter-left { width: 100%; }
  .v-field { flex: 1; }
  .v-field select { width: 100%; }
  .btn-export { width: 100%; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .kpi-card { padding: 16px 14px; }
  .kpi-value { font-size: 32px; }
  .kpi-sparkline { width: 60px; height: 28px; }
  .chart-card { padding: 16px; }
  .chart-wrap { min-height: 260px; }
  .insight-card { padding: 16px; }
  .data-table thead th:first-child, .data-table tbody td:first-child { position: sticky; left: 0; background: var(--bg-surface); z-index: 3; }
  .data-table tbody tr.total-row td:first-child { background: #EEF3FF; }
  .lc-tab, .dc-tab { font-size: 11px; padding: 5px 10px; }
}
/* ── 自动刷新提示条 ── */
.viewer-refresh-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  background: var(--primary); color: #fff;
  padding: 10px 16px; font-size: 13.5px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(22,100,255,.25);
}
.viewer-refresh-bar button {
  border: none; background: #fff; color: var(--primary);
  font-weight: 700; font-size: 13px; padding: 6px 16px; border-radius: 8px; cursor: pointer;
}
/* ── 矩阵切换器（与徽标同风格的胶囊组） ── */
.viewer-matrix-switch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--bg-page);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
}
.viewer-matrix-switch button {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-3);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
  letter-spacing: 0.2px;
}
.viewer-matrix-switch button:hover {
  color: var(--primary-dark);
  background: var(--blue-50);
}
.viewer-matrix-switch button.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 6px rgba(22,100,255,0.25);
}
.viewer-matrix-switch button.active:hover {
  background: var(--primary-dark);
  color: #fff;
}

/* ── KPI Sparkline 增强：当前周期圆点 + 悬停数值 tooltip ──
   容器与 Charts.sparkline 的 SVG viewBox（80×36）1:1 对应，
   JS 注入的 left/top 直接使用 SVG 坐标。 */
.kpi-sparkline { position: relative; cursor: help; }
.kpi-spark-dot {
  position: absolute;
  left: 0; top: 0;                 /* 实际坐标由 JS 按折线终点注入 */
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;           /* 让 left/top 表示圆心 */
  border-radius: 50%;
  background: currentColor;        /* 取该 KPI 的指标色（JS 注入 color） */
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .9);
  pointer-events: none;
}
.kpi-spark-tooltip {
  position: absolute;
  left: 50%; bottom: 100%;
  transform: translateX(-50%) translateY(4px);
  margin-bottom: 8px;
  padding: 8px 10px;
  background: rgba(15, 23, 42, .92);
  color: #fff;
  border-radius: 6px;
  font-size: 11px;
  line-height: 1.45;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 50;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
}
.kpi-spark-tooltip::after {
  content: '';
  position: absolute;
  left: 50%; top: 100%;
  margin-left: -4px;
  border: 4px solid transparent;
  border-top-color: rgba(15, 23, 42, .92);
}
.kpi-spark-tip-title { font-weight: 700; margin-bottom: 4px; color: #fff; }
.kpi-spark-tip-row { display: flex; justify-content: space-between; gap: 12px; color: rgba(255, 255, 255, .82); }
.kpi-spark-tip-row.is-current { color: #fff; font-weight: 700; }
.kpi-spark-tip-v { font-variant-numeric: tabular-nums; }
.kpi-sparkline:hover .kpi-spark-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

/* .kpi-card 默认 overflow:hidden 会裁掉向上弹出的 tooltip；
   仅对带 tooltip 的卡片解除裁剪（顶部强调线 ::before 自带圆角，无需补） */
.kpi-card.has-spark-tip { overflow: visible; }
.kpi-card.has-spark-tip:hover { z-index: 5; }

/* ── 加密解锁遮罩（口令加密分享视图时显示） ── */
.unlock-overlay {
  position: fixed; inset: 0; z-index: 400;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15,23,42,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.unlock-box {
  width: min(420px, 90vw); background: var(--bg-surface);
  border-radius: var(--radius-lg); padding: 28px 26px;
  box-shadow: var(--shadow-hover); display: flex; flex-direction: column; gap: 14px;
}
.unlock-title { font-size: 18px; font-weight: 700; color: var(--ink); }
.unlock-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.unlock-input {
  height: 44px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 500;
}
.unlock-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,100,255,.12); }
.unlock-err { font-size: 12px; color: var(--danger); min-height: 14px; }
.unlock-btn {
  height: 44px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary-grad-1), var(--primary));
  color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
}
.unlock-btn:disabled { opacity: .6; cursor: default; }
.unlock-toggle {
  position: absolute; right: 8px; height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px; background: #fff;
  font-size: 12px; color: var(--ink-2); cursor: pointer;
}
</style>

  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    // 返回 ISO 周年（周四所在年），而非输入日期的日历年——修复跨年周（12月底属次年 W01）错标年份
    return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
  }
  function weekKeyFromDate(str) {
    const d = new Date(str);
    if (isNaN(d)) return null;
    return isoWeek(d);
  }
  function monthKeyFromDate(str) {
    const d = new Date(str);
    if (isNaN(d)) return null;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function quarterKeyFromDate(str) {
    const d = new Date(str);

  // ── 口令加密分享视图：解密（与 app.js encryptData 对称；AES-GCM + PBKDF2）──
  function b64ToBuf(b) {

  }
  async function decryptData(env, pass) {
    const key = await deriveKey(pass, b64ToBuf(env.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(env.iv) }, key, b64ToBuf(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // R15：查看器内矩阵筛选状态（默认全量 A+B）；由顶部 #viewerMatrixSwitch 控制

  function esc(s) {

  function fmtVal(v) {

    const a = Math.abs(v);

  // R-matrix-platforms-v2（修订）：按当前周期聚合结果过滤平台（而非全量 d.metrics）。

  // 既不显示也不导出（用户 2026-09-14 报：全0/全-/全/ 代表无数据，不能当数据展示）。
  // 旧版仅按 byPlatform 是否含该 code（是否已建聚合 key）判断 → 历史周有记录但当前全0的平台也被列为"有数据"。
  function platformHasData(bp) {
    if (!bp) return false;
    for (let i = 0; i < TABLE_FIELDS.length; i++) {
      const v = bp[TABLE_FIELDS[i]];
      if (typeof v === 'number' && isFinite(v) && v !== 0) return true;
    }
    return false;
  }
  function metricHasData(m) {
    if (!m) return false;
    for (let i = 0; i < TABLE_FIELDS.length; i++) {

      if (typeof v === 'number' && isFinite(v) && v !== 0) return true;
    }
    return false;
  }
  function visiblePlatforms(optBucket) {
    const d = getData();
    const platforms = d.platforms || [];
    const byOrder = function (a, b) { return (a.order || 0) - (b.order || 0); };
    if (optBucket && optBucket.byPlatform) {
      // 传入当前周期 bucket：bucket 已由 aggregateByPeriod 按当前矩阵过滤，
      // 这里只需再排除"真正无数据"（全0/null）的平台 code
      return platforms.filter(function (p) {
        return platformHasData(optBucket.byPlatform[p.code]);

    }
    // 无 bucket 回退：按全量 d.metrics 过滤（KPI 跨周期等场景），同样排除全0/null 记录

      .filter(function (p) { return codesWithData.has(p.code); })

  }
  function kpiMetrics() {
    const d = getData();

    // Bug-4①：默认 5 个核心指标（发布/播放阅读/互动/线索/转化），与主系统 kpiMetrics 一致
    return (Array.isArray(km) && km.length) ? km : ['publish', 'readPlay', 'interaction', 'lead', 'transfer'];
  }
  function weekKeyToDates(wk) {
    if (!wk || !/^\d{4}-W\d{2}$/.test(wk)) return null;
    const [ys, ws] = wk.split('-W');
    const y = +ys, w = +ws;
    const jan4 = new Date(Date.UTC(y, 0, 4));
    const jan4Day = (jan4.getUTCDay() + 6) % 7;
    const mon = new Date(Date.UTC(y, 0, 4 - jan4Day + (w - 1) * 7));
    const sun = new Date(Date.UTC(mon.getUTCFullYear(), mon.getUTCMonth(), mon.getUTCDate() + 6));
    return [mon, sun];
  }
  // 当周内「按天数占比」归月：跨月周（6.29-7.05）取天数多的月作为该周归属
  // 与 db.js 的 dominantMonthKeyOf 保持一致，避免分享视图与本地端月/季/年聚合口径不一致
  function dominantMonthKeyOf(weekKey) {
    if (!weekKey) return null;
    const range = weekKeyToDates(weekKey);
    if (!range) return null;
    const monthDays = {};
    const mon = range[0];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon.getTime());
      d.setUTCDate(mon.getUTCDate() + i);
      const mk = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
      monthDays[mk] = (monthDays[mk] || 0) + 1;
    }
    let bestKey = null, bestN = 0;
    for (const k in monthDays) { if (monthDays[k] > bestN) { bestN = monthDays[k]; bestKey = k; } }
    return bestKey;
  }
  function periodKeyOf(metric, periodType) {
    if (!metric || !metric.startDate) return null;
    const wk = weekKeyFromDate(metric.startDate);
    if (!wk) return null;
    // 优先读用户自定义周度归属（与本地端 db.js 口径一致）

      switch (periodType) {
        case 'month': return mk;

      case 'quarter': {

        if (!mk) return null;
        const [y, m] = mk.split('-');

      case 'year': {

  function periodBounds(key, periodType) {
    if (periodType === 'week' && /^\d{4}-W\d{2}$/.test(key)) {
      return { start: mondayOfWeekKey(key), end: sundayOfWeekKey(key) };
    }
    if (periodType === 'month' && /^\d{4}-\d{2}$/.test(key)) {
      const [y, m] = key.split('-').map(Number);
      const endDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
      return { start: key + '-01', end: key + '-' + String(endDay).padStart(2, '0') };
    }
    if (periodType === 'quarter' && /^\d{4}-Q\d$/.test(key)) {
      const [ys, qs] = key.split('-Q');
      const y = +ys, q = +qs;
      const sm = (q - 1) * 3 + 1;

      const endDay = new Date(Date.UTC(y, em, 0)).getUTCDate();
      return { start: y + '-' + String(sm).padStart(2, '0') + '-01', end: y + '-' + String(em).padStart(2, '0') + '-' + String(endDay).padStart(2, '0') };

  function newRow() {

    const row = newRow();
    for (const m of metrics) {

    const limitKey = anchor || keys[keys.length - 1] || '';

      render();

    function bindLineEvents(c, opts, geo) {
      const plot = c.querySelector('.lc-plot');
      const svg = plot.querySelector('svg');
      const cross = c.querySelector('.lc-cross');
      const hl = c.querySelector('.lc-hl');
      const tip = c.querySelector('.chart-tooltip');
      const vis = () => (opts.series || []).filter(s => s && Array.isArray(s.data) && s.data.length && !geo.hidden.has(s.name));

      c.querySelectorAll('.lc-tab').forEach(b => b.onclick = () => {
        const ti = +b.dataset.tab;
        if (opts.onTab) opts.onTab(geo.tabCounts[ti], ti);
      });
      c.querySelectorAll('.line-legend-item').forEach(li => li.onclick = () => {
        try {
          const nm = li.dataset.name;
          if (geo.hidden.has(nm)) geo.hidden.delete(nm); else geo.hidden.add(nm);
          c.__render();
        } catch (e) { console.error('lineChart legend click', e); }
      });

      function showAt(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;
        const svgX = (clientX - rect.left) / rect.width * geo.W;
        let i = geo.n <= 1 ? 0 : Math.round((svgX - geo.padL) / (geo.plotW / (geo.n - 1)));
        if (i < 0) i = 0; if (i > geo.n - 1) i = geo.n - 1;
        const first = vis()[0];
        const x = geo.xAt(i), y = geo.yAt(first && Array.isArray(first.data) ? first.data[i] : 0);
        cross.setAttribute('x1', x); cross.setAttribute('x2', x);
        cross.style.display = '';
        hl.setAttribute('cx', x); hl.setAttribute('cy', y); hl.style.display = '';
        const s = vis();
        let html = `<div style="font-weight:700;margin-bottom:5px">${esc2((opts.xLabels || [])[i] || '')}</div>`;
        s.forEach(se => {
          if (!se || !Array.isArray(se.data)) return;
          const cur = se.data[i] || 0;
          const prev = i > 0 ? se.data[i - 1] : null;
          const arrow = pctStr(cur, prev);
          html += `<div style="display:flex;align-items:center;gap:6px;margin:2px 0;white-space:nowrap">
            <span style="width:9px;height:9px;border-radius:2px;display:inline-block;background:${se.color}"></span>
            <span style="color:#585858">${esc2(se.name)}</span>
            <b style="margin-left:auto">${esc2(fmtVal(cur))}</b>
            ${arrow ? `<span style="color:${cur >= (prev || 0) ? '#00C853' : '#EB103C'};font-size:11px">${arrow}</span>` : ''}
          </div>`;
        });
        tip.innerHTML = html;
        tip.style.opacity = '1';
        const pr = plot.getBoundingClientRect();
        let left = clientX - pr.left + 14, top = clientY - pr.top + 14;
        if (left + 210 > pr.width) left = pr.width - 220;
        if (left < 0) left = 4;
        if (top + tip.offsetHeight + 10 > pr.height) top = pr.height - tip.offsetHeight - 10;
        if (top < 0) top = 4;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }
      function hide() { cross.style.display = 'none'; hl.style.display = 'none'; tip.style.opacity = '0'; }

      plot.addEventListener('mousemove', e => { try { showAt(e.clientX, e.clientY); } catch (e) { console.error('lineChart hover', e); } });
      plot.addEventListener('mouseleave', hide);
      plot.addEventListener('touchstart', e => { try { if (e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); } catch (e) { console.error('lineChart hover', e); } }, { passive: true });
      plot.addEventListener('touchmove', e => {
        try {
          if (e.touches[0]) { e.preventDefault(); showAt(e.touches[0].clientX, e.touches[0].clientY); tip.classList.add('mobile'); }
        } catch (e) { console.error('lineChart hover', e); }
      }, { passive: false });
      plot.addEventListener('touchend', () => { tip.classList.add('mobile'); setTimeout(hide, 1500); });
    }

    /* ---------- 环形图 ---------- */
    function donutChart(opts) {
      const c = opts.container;
      if (!c) return;
      const H = opts.height || 300;
      const size = H;
      const cx = size / 2, cy = size / 2;
      const r = size * 0.34, sw = Math.max(20, size * 0.13);
      const C = 2 * Math.PI * r;
      c.setAttribute('data-chart', 'donut');

      function render() {
        if (opts.centerMain == null) opts.centerMain = opts.centerSub || '';
        if (opts.centerTopLabel == null) opts.centerTopLabel = opts.centerLabel || '';

        // Bug-4③：分享视图挂载时序中容器可能瞬时 0 宽，SVG width:100% 渲染为 0 宽而不可见（折线图有 640 兜底故正常，环形图无兜底）。
        // 待下一帧布局就绪再渲染，彻底避免“环形图空白只剩标题”。
        if (!c.clientWidth) {
          if ((c.__donutRetry = (c.__donutRetry || 0) + 1) <= 60) { requestAnimationFrame(c.__render); return; }
        }

        const items = (opts.items || []).filter(it => it.value > 0);
        const total = items.reduce((s, it) => s + it.value, 0);

        if (total <= 0) {
          c.innerHTML = '<div class="chart-empty-state">🍩 暂无平台数据</div>';
          return;
        }

        let segs = '', cum = 0;
        items.forEach((it, i) => {
          const frac = it.value / total;
          const segLen = frac * C;
          const startDeg = cum * 360 - 90;
          cum += frac;
          segs += `<g class="donut-seg-g" data-i="${i}" style="transition:transform .18s ease;cursor:pointer">
            <circle class="chart-donut-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${sw}"
              style="--seg-len:${segLen.toFixed(2)}; stroke-dasharray:${segLen.toFixed(2)} ${C.toFixed(2)}; stroke-dashoffset:0; transform:rotate(${startDeg.toFixed(2)}deg); transform-box:fill-box; transform-origin:center; animation-delay:${(i * 0.08).toFixed(2)}s"/>
          </g>`;
        });

        const legendHtml = '<div class="donut-legend">' + items.map((it) => {
          const pct = (it.value / total * 100).toFixed(0);
          return `<div class="donut-legend-item"><span class="swatch" style="background:${it.color}"></span><span class="lbl">${esc2(it.label)}</span><span class="pct">${pct}%</span></div>`;
        }).join('') + '</div>';

        const centerHtml = `
          <div class="donut-center">
            <div class="donut-center-sub">${esc2(opts.centerTopLabel || '')}</div>
            <div class="donut-center-main" style="color:${opts.centerColor || '#1664FF'}">${esc2(opts.centerMain || '')}</div>
            <div class="donut-center-pct">${esc2(opts.centerSubLabel ? opts.centerSubLabel + ' ' : '')}${esc2(opts.centerSubValue || '')}${opts.centerSubPct ? ' ' + esc2(opts.centerSubPct) : ''}</div>
          </div>`;
        c.innerHTML = `
          <div class="dc-plot" style="position:relative">
            <svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}" style="display:block">${segs}</svg>
            ${centerHtml}
            <div class="chart-tooltip"></div>
          </div>${legendHtml}`;

        bindDonutEvents(c, opts, { items, total, cx, cy, r, C, size });
      }
      c.__render = render;
      render();
    }

    function bindDonutEvents(c, opts, ctx) {
      const plot = c.querySelector('.dc-plot');
      const tip = c.querySelector('.chart-tooltip');
      const sub = c.querySelector('.donut-center-sub');
      const main = c.querySelector('.donut-center-main');
      const pct = c.querySelector('.donut-center-pct');
      const baseSub = opts.centerTopLabel || '';
      const baseMain = opts.centerMain || '';
      const basePct = (opts.centerSubLabel ? opts.centerSubLabel + ' ' : '') + (opts.centerSubValue || '') + (opts.centerSubPct ? ' ' + opts.centerSubPct : '');
      const segs = c.querySelectorAll('.donut-seg-g');

      function enter(i) {
        const it = ctx.items[i]; if (!it) return;
        const frac = it.value / ctx.total;
        const midDeg = (cumBefore(i) + frac / 2) * 360 - 90;
        const rad = midDeg * Math.PI / 180;
        const dx = Math.cos(rad) * 6, dy = Math.sin(rad) * 6;
        segs.forEach((g, gi) => {
          if (gi === i) { g.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px)`; g.style.opacity = '1'; }
          else g.style.opacity = '0.6';
        });
        if (sub) sub.textContent = it.label;
        if (main) main.textContent = fmtVal(it.value);
        if (pct) pct.textContent = '占比 ' + (it.value / ctx.total * 100).toFixed(1) + '%';
        tip.innerHTML = `<div style="font-weight:700;margin-bottom:3px">${esc2(it.label)}</div><div>${esc2(fmtVal(it.value))} · ${(it.value / ctx.total * 100).toFixed(1)}%</div>`;
        tip.style.opacity = '1';
      }
      function cumBefore(i) { let s = 0; for (let k = 0; k < i; k++) s += ctx.items[k].value / ctx.total; return s; }
      function leave() {
        segs.forEach(g => { g.style.transform = ''; g.style.opacity = '1'; });
        if (sub) sub.textContent = baseSub;
        if (main) main.textContent = baseMain;
        if (pct) pct.textContent = basePct;
        tip.style.opacity = '0';
      }
      segs.forEach(g => {
        const i = +g.dataset.i;
        g.addEventListener('mouseenter', () => enter(i));
        g.addEventListener('mouseleave', leave);
        g.addEventListener('touchstart', e => { e.preventDefault(); enter(i); tip.classList.add('mobile'); }, { passive: false });
      });
      plot.addEventListener('touchend', () => { tip.classList.add('mobile'); setTimeout(leave, 1500); });
    }

    /* ---------- Sparkline ---------- */
    function sparkline(opts) {
      const c = opts.container;
      if (!c) return;
      const W = opts.width || 80, H = opts.height || 36, color = opts.color || '#1664FF';
      const data = (opts.data || []).filter(v => typeof v === 'number' && isFinite(v));
      if (data.length < 2) { c.innerHTML = ''; return; }
      const max = Math.max.apply(null, data), min = Math.min.apply(null, data);
      const pad = 3;
      const xAt = i => pad + (W - 2 * pad) * (i / (data.length - 1));
      const yAt = v => pad + (H - 2 * pad) * (1 - (v - min) / ((max - min) || 1));
      const pts = data.map((v, i) => [xAt(i), yAt(v)]);
      const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = line + ` L ${xAt(data.length - 1).toFixed(1)} ${H - pad} L ${xAt(0).toFixed(1)} ${H - pad} Z`;
      const gid = 'sp' + Math.random().toString(36).slice(2, 7);
      const firstAnim = !c.__sparkAnimated;
      c.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block${firstAnim ? ';animation:kpiSparkIn .4s ease both' : ''}">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#${gid})"/>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${xAt(data.length - 1).toFixed(1)}" cy="${yAt(data[data.length - 1]).toFixed(1)}" r="2.2" fill="${color}"/>
      </svg>`;
      c.__sparkAnimated = true;
    }

    /* ---------- 全局 resize 重绘（防抖） ---------- */
    function resizeAll() {
      document.querySelectorAll('[data-chart]').forEach(node => { if (node.__render) { try { node.__render(); } catch (e) { console.error('chart resize 重绘失败', e); } } });
    }
    window.addEventListener('resize', debounce(resizeAll, 150));

    return { lineChart, donutChart, sparkline, resolvePlatformColor, PLATFORM_COLORS, FALLBACK_PALETTE };
  })();

  // =========================================================
  // 渲染层（Light 主题 + 原生 SVG 图表）
  // =========================================================
  var _trendCount = null;   // 折线图当前 Tab 对应的周期数（4/8/12）
  var _donutMetric = 'readPlay'; // 环形图当前指标（播放量/互动量/发布量）
  var _insightTopPlatMetric = 'readPlay'; // 洞察区「平台贡献 Top3」当前指标（可切换：播放阅读/互动/发布）

  function renderAll() {
    const d = getData();
    const lastDate = maxDataDate();
    if (el('dataWeek')) el('dataWeek').textContent = lastDate ? fmtDate(lastDate) : '--';
    if (el('genDate')) el('genDate').textContent = d.generatedAt || '--';
    var mb = el('matrixBadge');
    if (mb) {
      // R15：全部为预期默认值，去掉 warn 警示样式，改为中性展示
      if (!_viewMatrix || _viewMatrix === 'all') { mb.textContent = '矩阵 全部'; mb.classList.remove('warn'); }
      else { mb.textContent = '矩阵 ' + _viewMatrix; mb.classList.remove('warn'); }
    }

    const pt = el('periodType') ? el('periodType').value : 'week';
    renderPeriodOptions(pt);
    // Bug-4⑤：先绑定周期切换 / 导出 / 移动导航事件，再渲染。避免 refresh 内任一图表抛错导致控件永不绑定（周期切换/导出无响应）
    bindFilter();
    bindMobileNav();
    refresh();
  }

  function isPeriodEnded(key, periodType) {
    const bounds = periodBounds(key, periodType);
    if (!bounds.end) return false;
    const today = new Date().toISOString().slice(0, 10);
    return bounds.end < today;
  }
  function defaultEndedPeriod(periodType) {
    const keys = allPeriods(periodType);
    for (let i = keys.length - 1; i >= 0; i--) {
      if (isPeriodEnded(keys[i], periodType)) return keys[i];
    }
    return keys[keys.length - 1] || '';
  }

  function renderPeriodOptions(periodType) {
    const sel = el('periodSelect');
    if (!sel) return;
    const keys = allPeriods(periodType);
    sel.innerHTML = '';
    for (let i = keys.length - 1; i >= 0; i--) {
      const o = document.createElement('option');
      o.value = keys[i];
      o.textContent = periodLabel(keys[i], periodType);
      sel.appendChild(o);
    }
    if (keys.length) sel.value = defaultEndedPeriod(periodType);
  }

  function currentPeriod() {
    const pt = el('periodType') ? el('periodType').value : 'week';
    const sel = el('periodSelect');
    const key = sel ? sel.value : (allPeriods(pt)[allPeriods(pt).length - 1] || '');
    return { periodType: pt, key };
  }

  function refresh() {
    const { periodType, key } = currentPeriod();
    if (!key) return;
    const lbl = periodLabel(key, periodType);
    // Bug-4③/4④/4⑤：标签与每个区块独立容错，单块抛错不影响其余区块渲染与控件绑定
    try { if (el('tableTag')) el('tableTag').textContent = lbl; } catch (e) {}
    try { if (el('summaryTag')) el('summaryTag').textContent = lbl; } catch (e) {}
    try { if (el('bannerRange')) el('bannerRange').textContent = '统计周期：' + lbl; } catch (e) {}
    try { if (el('kpiSub')) el('kpiSub').textContent = lbl; } catch (e) {}
    const steps = [
      ['KPI', function () { renderKPI(key, periodType); }],
      ['洞察', function () { renderInsights(key, periodType); }],
      ['趋势图', function () { renderTrendChart(key, periodType); }],
      ['环形图', function () { renderDonutChart(key, periodType); }],
      ['明细表', function () { renderTable(key, periodType); }],
      ['周期总结', function () { renderSummary(key, periodType); }]
    ];
    steps.forEach(function (s) { try { s[1](); } catch (e) { console.error('分享视图渲染[' + s[0] + ']失败', e); } });
  }

  function kpiSum(bucket, plats, metric) {
    let sum = 0;
    for (const p of plats) {
      const bp = bucket.byPlatform[p.code];
      if (bp) sum += (bp[metric] || 0);
    }
    return sum;
  }

  /* KPI Sparkline 增强层：悬停 tooltip（逐周期真实数值）+ 当前周期高亮圆点。
     与主系统 app.js 的 enhanceSparkline 保持同一实现。
     必须在 Charts.sparkline() 之后调用——后者用 innerHTML 重绘会清空容器。
     不修改 Charts.sparkline 本身，只在容器内追加覆盖层。 */
  const PERIOD_UNIT = { week: '周', month: '月', quarter: '季', year: '年' };
  function enhanceSparkline(box, opts) {
    if (!box) return;
    opts = opts || {};
    const labels = opts.labels || [];
    const values = opts.values || [];
    const unit = opts.unit || '周';

    // 与 Charts.sparkline 一致的过滤规则，保证 tooltip 行与折线点一一对应
    const pairs = values
      .map(function (v, i) { return { v: v, label: labels[i] != null ? String(labels[i]) : '' }; })
      .filter(function (p) { return typeof p.v === 'number' && isFinite(p.v); });
    // 少于 2 点时 Charts.sparkline 不绘图，不能留下孤立圆点
    if (pairs.length < 2) return;

    const W = opts.width || 80, H = opts.height || 36, pad = 3;
    const color = opts.color || '#1664FF';
    const nums = pairs.map(function (p) { return p.v; });
    const max = Math.max.apply(null, nums), min = Math.min.apply(null, nums);
    const lastX = W - pad;
    const lastY = pad + (H - 2 * pad) * (1 - (nums[nums.length - 1] - min) / ((max - min) || 1));

    const dot = document.createElement('span');
    dot.className = 'kpi-spark-dot';
    dot.style.left = lastX.toFixed(1) + 'px';
    dot.style.top = lastY.toFixed(1) + 'px';
    dot.style.color = color;
    box.appendChild(dot);

    const tip = document.createElement('div');
    tip.className = 'kpi-spark-tooltip';
    const head = document.createElement('div');
    head.className = 'kpi-spark-tip-title';
    head.textContent = '趋势（近' + pairs.length + unit + '）';
    tip.appendChild(head);
    pairs.forEach(function (p, i) {
      const isLast = (i === pairs.length - 1);
      const row = document.createElement('div');
      row.className = 'kpi-spark-tip-row' + (isLast ? ' is-current' : '');
      const k = document.createElement('span');
      k.className = 'kpi-spark-tip-k';
      k.textContent = p.label + ':';
      const val = document.createElement('span');
      val.className = 'kpi-spark-tip-v';
      val.textContent = fmt(p.v) + (isLast ? '（当前' + unit + '）' : '');
      row.appendChild(k);
      row.appendChild(val);
      tip.appendChild(row);
    });
    box.appendChild(tip);

    // .kpi-card 默认 overflow:hidden 会裁掉 tooltip，仅对带 tooltip 的卡片解除裁剪
    const card = box.closest ? box.closest('.kpi-card') : null;
    if (card) card.classList.add('has-spark-tip');
  }

  function renderKPI(key, periodType) {
    const bucket = aggregateByPeriod(periodType, key);
    const plats = visiblePlatforms(bucket);
    const cards = el('kpiCards');
    if (!cards) return;
    cards.innerHTML = '';
    if (!plats.length) { cards.innerHTML = '<div class="kpi-card"><div class="kpi-value">暂无数据</div></div>'; return; }

    const keys = allPeriods(periodType);
    const idx = keys.indexOf(key);
    const prevKey = idx > 0 ? keys[idx - 1] : null;
    const prevBucket = prevKey ? aggregateByPeriod(periodType, prevKey) : null;
    const bounds = periodBounds(key, periodType);
    const rangeText = bounds.start && bounds.end ? '(' + bounds.start.slice(5) + ' ~ ' + bounds.end.slice(5) + ')' : '';

    // 近 8 周期序列，用于 KPI Sparkline（与主系统一致：取自聚合序列近 8 周）
    const series8 = aggregateSeries(periodType, 8);
    const keys8 = Object.keys(series8).sort();

    const metrics = kpiMetrics();
    for (const metric of metrics) {
      let sum = 0;
      for (const p of plats) {
        const bp = bucket.byPlatform[p.code];
        if (bp) sum += (bp[metric] || 0);
      }
      const prevSum = prevBucket ? kpiSum(prevBucket, plats, metric) : null;
      const rate = calcRate(sum, prevSum);

      let deltaHtml;
      if (rate === null) {
        deltaHtml = '<div class="kpi-change flat">环比 --</div>';
      } else {
        const dir = rate > 0 ? 'up' : (rate < 0 ? 'down' : 'flat');
        const arrow = rate > 0 ? '↑' : (rate < 0 ? '↓' : '→');
        deltaHtml = '<div class="kpi-change ' + dir + '">' + arrow + ' ' + fmtPercent(rate) + ' <span class="vs">vs ' + esc(periodLabel(prevKey, periodType)) + '</span></div>';
      }
      if (rangeText) deltaHtml += '<div class="kpi-range">' + esc(rangeText) + '</div>';

      // Sparkline 数据：近 8 周期该指标在可见平台上的合计序列
      const sparkData = keys8.map(k => kpiSum(series8[k], plats, metric));

      const card = document.createElement('div');
      card.className = 'kpi-card';
      card.style.setProperty('--kpi-accent', METRIC_ICON_COLORS[metric] || '#1664FF');
      card.innerHTML =
        '<div class="kpi-label"><span class="kpi-ico" style="color:' + (METRIC_ICON_COLORS[metric] || '#1664FF') + '">' + (METRIC_ICONS[metric] || '') + '</span> ' + esc(METRIC_LABELS[metric] || metric) + '</div>' +
        '<div class="kpi-row">' +
          '<div class="kpi-value num">' + fmt(sum) + '</div>' +
          '<div class="kpi-sparkline" data-spark="' + esc(metric) + '"></div>' +
        '</div>' +
        deltaHtml;
      cards.appendChild(card);

      const sparkBox = card.querySelector('.kpi-sparkline');
      const sparkColor = METRIC_COLORS[metric] || '#1664FF';
      Charts.sparkline({ container: sparkBox, data: sparkData, color: sparkColor, width: 80, height: 36 });
      // 必须在 sparkline 之后：Charts.sparkline 会 innerHTML 覆盖容器
      enhanceSparkline(sparkBox, {
        labels: keys8, values: sparkData, color: sparkColor,
        width: 80, height: 36, unit: PERIOD_UNIT[periodType] || '周'
      });
    }

    // Bug-4①：「关键变化」卡片与 5 张 KPI 指标卡并排放在同一区域（KPI 网格第 6 个槽位，3 列布局下为第二行末位）
    if (prevKey) {
      const changeCard = document.createElement('div');
      changeCard.className = 'kpi-card kpi-change-card';
      changeCard.style.setProperty('--kpi-accent', '#1664FF');
      changeCard.innerHTML =
        '<div class="kpi-label"><span class="kpi-ico" style="color:#1664FF">' + KEYCHANGE_ICON + '</span> 关键变化</div>' +
        '<div class="insight-body">' + keyChangeInnerHtml(bucket, prevBucket, periodType, prevKey) + '</div>';
      cards.appendChild(changeCard);
    }
  }

  // 「关键变化」卡片内部 HTML（Hero 指标 + 其余标签云），供 KPI 网格与洞察区复用
  function keyChangeInnerHtml(bucket, prevBucket, periodType, prevKey) {
    let changeHtml = '<p class="muted" style="margin:auto">暂无环比数据</p>';
    if (prevKey && prevBucket) {
      const plats = visiblePlatforms(bucket);
      const changes = [];
      for (const m of kpiMetrics()) {
        const cur = kpiSum(bucket, plats, m);
        const prev = kpiSum(prevBucket, plats, m);
        const rate = calcRate(cur, prev);
        if (rate !== null) changes.push({ metric: METRIC_LABELS[m] || m, rate: rate, cur: cur });
      }
      changes.sort(function (a, b) { return Math.abs(b.rate) - Math.abs(a.rate); });
      if (changes.length) {
        const top = changes[0];
        const up = top.rate > 0;
        const arrow = up ? '↑' : '↓';
        changeHtml = '<div class="change-hero ' + (up ? 'up' : 'down') + '"><div class="arrow">' + arrow + '</div><div><div class="metric">变化最大指标 · ' + esc(top.metric) + '</div><div class="value">' + fmt(top.cur) + '</div></div><div class="rate">' + fmtPercent(top.rate) + '</div></div>';
        changeHtml += '<div class="change-tags">' + changes.slice(1).map(function (c) {
          const dir = c.rate > 0 ? 'up' : (c.rate < 0 ? 'down' : '');

          return '<span class="change-tag ' + dir + '">' + esc(c.metric) + ' ' + icon + ' ' + fmtPercent(c.rate) + '</span>';
        }).join('') + '</div>';
      }
    }
    return changeHtml;
  }

  function cleanWk(wk) { return (typeof wk === 'string') ? wk.replace(/__[AB]$/, '') : wk; }

  function getPeriodSummaries(key, periodType) {
    const d = getData();
    const summaries = (_viewMatrix === 'all') ? (d.summaries || []) : (d.summaries || []).filter(function (s) { return (s.matrix || 'A') === _viewMatrix; });
    if (periodType === 'week') {
      const s = summaries.find(x => x && cleanWk(x.weekKey) === key);
      return s ? [s] : [];
    }
    const bounds = periodBounds(key, periodType);
    if (!bounds.start || !bounds.end) return [];
    return summaries.filter(s => {
      if (!s.weekKey) return false;
      const b = periodBounds(cleanWk(s.weekKey), 'week');
      if (!b.start || !b.end) return false;
      return b.start >= bounds.start && b.end <= bounds.end;
    });
  }

  // =========================================================
  // Excel 导出（原生 OOXML/ZIP，STORE 无压缩，零依赖，自包含）
  // =========================================================
  function escapeXml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }
  function colName(n) {
    let s = '';
    while (n >= 0) { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
    return s;
  }
  function buildSheetXML(rows, sharedIndex) {
    let xml = '<sheetData>';
    rows.forEach((row, ri) => {
      xml += '<row r="' + (ri + 1) + '">';
      row.forEach((cell, ci) => {
        const ref = colName(ci) + (ri + 1);
        if (typeof cell === 'number') {
          xml += '<c r="' + ref + '"><v>' + cell + '</v></c>';
        } else {
          const idx = sharedIndex[String(cell)];
          xml += '<c r="' + ref + '" t="s"><v>' + idx + '</v></c>';
        }
      });
      xml += '</row>';
    });
    xml += '</sheetData>';
    return xml;
  }

  // ---- 原生轻量 ZIP 生成（STORE 无压缩，零依赖，仅用于查看器导出） ----
  function utf8Bytes(str) {
    const out = [];
    for (let i = 0; i < str.length; i++) {
      let c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else if (c >= 0xd800 && c <= 0xdbff) {
        const c2 = str.charCodeAt(++i);
        const cp = 0x10000 + ((c & 0x3ff) << 10) + (c2 & 0x3ff);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }
    return Uint8Array.from(out);
  }
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    return t;
  })();
  function crc32(bytes) {
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xff];
    return (crc ^ 0xffffffff) >>> 0;
  }
  function concatBytes(arrs) {
    let total = 0; for (const a of arrs) total += a.length;
    const out = new Uint8Array(total); let p = 0;
    for (const a of arrs) { out.set(a, p); p += a.length; }
    return out;
  }
  function u16(n) { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, n, true); return b; }
  function u32(n) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0, true); return b; }
  function makeZip(files) {
    const chunks = [];
    const central = [];
    let offset = 0;
    for (const f of files) {
      const nameBytes = utf8Bytes(f.name);
      const data = f.data;
      const crc = crc32(data);
      const size = data.length;
      const local = concatBytes([
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), nameBytes, data
      ]);
      chunks.push(local);
      central.push(concatBytes([
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), nameBytes
      ]));
      offset += local.length;
    }
    const centralBytes = concatBytes(central);
    const end = concatBytes([
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(centralBytes.length), u32(offset), u16(0)
    ]);
    return concatBytes(chunks.concat([centralBytes, end]));
  }

  function exportExcel() {
    const { periodType, key } = currentPeriod();
    const label = periodLabel(key, periodType);

    const bucket = aggregateByPeriod(periodType, key);
    const plats = visiblePlatforms(bucket);
    const series = aggregateSeries(periodType, 8);
    const summaries = getPeriodSummaries(key, periodType);

    const sheet1Rows = [['平台', '发布', '互动', '阅读', '线索', '转销售']];
    for (const p of plats) {
      const bp = bucket.byPlatform[p.code] || {};
      sheet1Rows.push([p.name || p.code, bp.publish || 0, bp.interaction || 0, bp.readPlay || 0, bp.lead || 0, bp.transfer || 0]);
    }
    sheet1Rows.push(['合计', bucket.publish || 0, bucket.interaction || 0, bucket.readPlay || 0, bucket.lead || 0, bucket.transfer || 0]);

    const trendKeys = Object.keys(series).sort();
    const trendMetrics = kpiMetrics().slice(0, 3);
    const sheet2Rows = [['周期'].concat(trendMetrics.map(m => METRIC_LABELS[m] || m))];
    for (const k of trendKeys) {
      sheet2Rows.push([periodLabel(k, periodType)].concat(trendMetrics.map(m => series[k][m] || 0)));
    }

    const sheet3Rows = [];
    for (const s of summaries) {
      if (Array.isArray(s.good) && s.good.length) {
        sheet3Rows.push(['亮点内容']);
        for (const g of s.good) sheet3Rows.push([g.title || '无标题']);
        sheet3Rows.push(['']);
      }
      if (s.other) { sheet3Rows.push(['其他事项', s.other]); sheet3Rows.push(['']); }
      if (s.extraWriteup) { sheet3Rows.push(['补充说明', s.extraWriteup]); sheet3Rows.push(['']); }
    }
    if (!sheet3Rows.length) sheet3Rows.push(['本周期暂无总结']);

    const sheets = [
      { name: '平台指标', rows: sheet1Rows },
      { name: '趋势数据', rows: sheet2Rows },
      { name: '周期总结', rows: sheet3Rows }
    ];

    const shared = [];
    const sharedIndex = {};
    function addShared(v) {
      const s = String(v);
      if (s in sharedIndex) return sharedIndex[s];
      sharedIndex[s] = shared.length;
      shared.push(s);
      return sharedIndex[s];
    }
    sheets.forEach(sheet => sheet.rows.forEach(row => row.forEach(cell => { if (typeof cell !== 'number') addShared(cell); })));

    const files = {};
    files['[Content_Types].xml'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' + sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>');
    files['_rels/.rels'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    files['xl/workbook.xml'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((sheet, i) => '<sheet name="' + escapeXml(sheet.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>');
    files['xl/_rels/workbook.xml.rels'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>');
    files['xl/sharedStrings.xml'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + shared.length + '" uniqueCount="' + shared.length + '">' + shared.map(s => '<si><t>' + escapeXml(s) + '</t></si>').join('') + '</sst>');
    sheets.forEach((sheet, i) => {
      files['xl/worksheets/sheet' + (i + 1) + '.xml'] = utf8Bytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' + buildSheetXML(sheet.rows, sharedIndex) + '</worksheet>');
    });

    const zipped = makeZip(Object.keys(files).map(function (name) { return { name: name, data: files[name] }; }));
    const blob = new Blob([zipped], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tuke-viewer-' + label.replace(/[\s\/\\:?*"<>|]/g, '_') + '.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  // 自动刷新：仅在 https 协议（GitHub Pages 托管）下轮询自身 URL，发现新版本弹提示条
  function initAutoRefresh() {
    if (!/^https?:$/.test(location.protocol)) return; // file:// 不轮询，避免报错
    const meta = document.querySelector('meta[name="tuke-viewer-version"]');
    if (!meta) return;
    const current = meta.getAttribute('content') || '';
    if (!current) return;
    function showRefreshBar() {
      if (document.getElementById('refreshBar')) return;
      const bar = document.createElement('div');
      bar.id = 'refreshBar';
      bar.className = 'viewer-refresh-bar';
      bar.innerHTML = '<span>发现新版本 🔄 点击刷新查看最新数据</span><button onclick="location.reload(true)">点击刷新</button>';
      document.body.appendChild(bar);
    }
    setInterval(async () => {
      try {
        const base = location.href.split('#')[0].split('?')[0];
        const res = await fetch(base + '?_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const txt = await res.text();
        const m = txt.match(/name="tuke-viewer-version"\s+content="([^"]*)"/);
        if (m && m[1] && m[1] !== current) showRefreshBar();
      } catch (e) { /* 轮询异常静默，不影响阅读 */ }
    }, 5 * 60 * 1000);
  }

  // 加密分享视图：先解锁再渲染；明文分享视图直接渲染（兼容旧文件）
  function maybeUnlockThenRender() {
    const d = getData();
    if (d && d.__enc) {
      const ov = el('unlockOverlay');
      const input = el('unlockPass');
      const err = el('unlockErr');
      const btn = el('unlockBtn');
      if (!ov || !input || !btn) { renderAll(); return; }
      const toggle = el('unlockToggle');
      if (toggle && input) {
        toggle.onclick = function () { input.type = input.type === 'password' ? 'text' : 'password'; toggle.textContent = input.type === 'password' ? '显示' : '隐藏'; };
      }
      ov.style.display = 'flex';
      const attempt = async () => {
        const pass = (input.value || '').trim();
        if (!pass) { err.textContent = '请输入口令'; return; }
        btn.disabled = true; err.textContent = '';
        try {
          const plain = await decryptData(d, pass);
          window.__SHARED_DATA__ = plain;
          ov.style.display = 'none';
          renderAll();
        } catch (e) {
          err.textContent = '口令错误，请重试';
          btn.disabled = false; input.select();
        }
      };
      btn.onclick = attempt;
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
      setTimeout(function () { input.focus(); }, 50);
    } else {
      renderAll();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { maybeUnlockThenRender(); initAutoRefresh(); });
  } else {
    maybeUnlockThenRender(); initAutoRefresh();
  }
})();
</script>
